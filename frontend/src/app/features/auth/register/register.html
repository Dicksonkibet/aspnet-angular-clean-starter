<div class="mx-auto max-w-sm space-y-4">
  <h1 class="text-xl font-semibold">Sign up</h1>
  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-3">
    <input
      type="text"
      formControlName="fullName"
      placeholder="Full name"
      class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
    />
    <input
      type="email"
      formControlName="email"
      placeholder="Email"
      class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
    />
    <input
      type="password"
      formControlName="password"
      placeholder="Password (min. 8 characters)"
      class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm"
    />
    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }
    <button
      type="submit"
      [disabled]="loading()"
      class="w-full rounded-md bg-slate-900 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800 disabled:opacity-50"
    >
      {{ loading() ? 'Creating account...' : 'Sign up' }}
    </button>
  </form>
  <p class="text-sm text-slate-600">
    Already have an account? <a routerLink="/login" class="underline">Log in</a>
  </p>
</div>
